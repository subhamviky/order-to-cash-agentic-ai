name: o2c-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  o2c-agent-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: o2c-agent-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pipx install "poetry>=2.0,<3"
      - run: poetry install --no-interaction
      - name: Tests (settlement-service and reconciliation-service replaced by in-process fakes)
        run: poetry run pytest -q
      - name: AI-DLC release gate (E2A ProjectReleaseGate, seven stages; pytest ran in the step above)
        run: poetry run python -m o2c_agent_service.release.gate --skip-tests --report release-gate-report.json
      - name: Keep the gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-report
          path: o2c-agent-service/release-gate-report.json

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: o2c-agent-service/infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: fmt, validate and test against the mock provider (no Google Cloud project)
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate
          terraform test

  image:
    runs-on: ubuntu-latest
    needs: o2c-agent-service
    defaults:
      run:
        working-directory: o2c-agent-service
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Build the container image (P0 Dockerfile)
        run: docker build -t o2c-agent-service:ci .
      - name: Run it and ask it a policy question
        run: |
          docker run -d --name o2c -p 8000:8000 o2c-agent-service:ci
          for _ in $(seq 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs -X POST http://localhost:8000/api/v1/assistant \
            -H 'Content-Type: application/json' -H 'X-Tenant-Id: acme' -H 'X-User-Id: ci' -H 'X-User-Role: viewer' \
            -d '{"text": "Is there a discount for paying early?"}' | tee answer.json
          grep -q 'POL-TERMS-02' answer.json
      - name: Container logs
        if: always()
        run: docker logs o2c || true
